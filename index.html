<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070c18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sea POS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Sea POS - Ristorante Cassa e Magazzino</title>
    <meta name="description" content="Sistema gestionale per ristorante: cassa veloce, calcolo resto, divisione conto, gestione scorte e magazzino con sync Wi-Fi tra dispositivi." />
    <meta property="og:title" content="Sea POS - Ristorante Cassa e Magazzino" />
    <meta property="og:description" content="Sistema gestionale per ristorante: cassa veloce, calcolo resto, divisione conto, gestione scorte e magazzino con sync Wi-Fi." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 🔧 PWA: تسجيل Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ SW registered:', reg.scope))
            .catch((err) => console.log('❌ SW failed:', err));
        });
      }
    </script>
  </body>
</html>
