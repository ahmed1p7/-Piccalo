# ═══════════════════════════════════════════════════════════════════════════════
# 📱 Sea POS - Build Android APK (متوافق مع GitHub Actions)
# ═══════════════════════════════════════════════════════════════════════════════
# يبني APK من PWA باستخدام Capacitor (الأكثر استقراراً في CI)
# ═══════════════════════════════════════════════════════════════════════════════

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit
        env:
          CI: false

      - name: ⚡ Build frontend
        run: npm run build
        env:
          CI: false
          VITE_BASE_PATH: './'
          # 🔥 Firebase config (من GitHub Secrets)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 🔍 Verify build output
        run: |
          echo "📁 محتويات dist/:"
          ls -la dist/
          if [ -f "dist/manifest.json" ]; then
            echo "✅ manifest.json موجود"
          else
            echo "❌ manifest.json غير موجود!"
          fi

      # ═══ 1) تثبيت Capacitor ═══
      - name: 🔧 Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --save

      # ═══ 2) إنشاء capacitor.config.json يدوياً (بدل cap init الذي يفشل مع TS) ═══
      - name: 🎯 Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.sea.pos",
            "appName": "Sea POS",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          echo "✅ تم إنشاء capacitor.config.json"
          cat capacitor.config.json

      # ═══ 3) إضافة منصة Android ═══
      - name: 📱 Add Android platform
        run: npx cap add android

      # ═══ 4) نسخ الـ web build إلى Android ═══
      - name: 📋 Copy web assets
        run: npx cap copy android

      # ═══ 5) تعديل AndroidManifest.xml + build.gradle لتقليل dependencies ═══
      - name: ⚙️ Configure Android
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "✅ AndroidManifest.xml موجود"
            # إضافة أذونات الإنترنت
            sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <\/manifest>/' android/app/src/main/AndroidManifest.xml
            echo "✅ تم إضافة أذونات الإنترنت"
          fi

          # 🔧 إضافة Google Maven Mirror لتجنب 429 Too Many Requests
          cat > android/build.gradle.tmp << 'GRADLEEOF'
          // Sea POS - Build configuration with fallback mirrors
          GRADLEEOF

          # تعديل settings.gradle لتضمين Google Maven
          if [ -f "android/settings.gradle" ]; then
            python3 << 'PYEOF'
          with open('android/settings.gradle', 'r') as f:
              content = f.read()

          # إضافة pluginManagement و dependencyResolutionManagement إذا غير موجود
          if 'pluginManagement' not in content:
              content = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
                  maven { url 'https://jitpack.io' }
              }
          }
          """ + content
          else:
              # لو موجود، نغيّر FAIL_ON_PROJECT_REPOS إلى PREFER_SETTINGS
              content = content.replace('FAIL_ON_PROJECT_REPOS', 'PREFER_SETTINGS')

          with open('android/settings.gradle', 'w') as f:
              f.write(content)
          print("✅ تم تعديل settings.gradle (PREFER_SETTINGS + Google Maven mirrors)")
          PYEOF
          fi

      # ═══ 6) توليد Keystore للتوقيع ═══
      - name: 🔐 Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore sea-pos.keystore \
            -alias sea_pos_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sea_pos_2024 \
            -keypass sea_pos_2024 \
            -dname "CN=Sea POS, OU=Mobile, O=Sea Ristorante, L=Napoli, S=NA, C=IT"

      # ═══ 7) نسخ Keystore وتعديل build.gradle للتوقيع ═══
      - name: ⚙️ Configure signing
        run: |
          # نسخ keystore لمجلد android/app
          cp sea-pos.keystore android/app/sea-pos.keystore

          # إضافة signingConfigs و signingConfig لـ release في build.gradle
          python3 << 'PYEOF'
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          signing_config = """
          signingConfigs {
              release {
                  storeFile file('sea-pos.keystore')
                  storePassword 'sea_pos_2024'
                  keyAlias 'sea_pos_key'
                  keyPassword 'sea_pos_2024'
              }
          }
          """

          # إدراج signingConfigs قبل buildTypes
          if 'signingConfigs' not in content:
              content = content.replace('buildTypes {', signing_config + '\n    buildTypes {')

          # تفعيل signingConfig في release
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace(
                  'release {',
                  'release {\n            signingConfig signingConfigs.release'
              )

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print("✅ تم تعديل build.gradle للتوقيع")
          PYEOF

      # ═══ 8) بناء APK ═══
      - name: 📱 Build APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x test
        env:
          CI: false

      # ═══ 9) تجميع APKs ═══
      - name: 📤 Collect APK files
        if: always()
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "📦 وجدت: $apk"
            cp "$apk" apk-output/ 2>/dev/null || true
          done

          # إعادة تسمية APK
          if [ -f "apk-output/app-release.apk" ]; then
            mv apk-output/app-release.apk apk-output/Sea-POS.apk
          fi
          if [ -f "apk-output/app-debug.apk" ]; then
            mv apk-output/app-debug.apk apk-output/Sea-POS-debug.apk
          fi

          # عرض النتائج
          echo ""
          echo "📁 APK files:"
          ls -la apk-output/*.apk 2>/dev/null || echo "❌ لا توجد ملفات APK"

      # ═══ 10) رفع APK كـ artifact ═══
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sea-POS-APK
          path: |
            apk-output/*.apk
          retention-days: 90
          if-no-files-found: warn

      # ═══ 11) تقرير النتائج ═══
      - name: ✅ Report results
        if: always()
        run: |
          echo "## 📱 Build APK Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          APK_COUNT=$(find apk-output -name "*.apk" -type f 2>/dev/null | wc -l)

          if [ "$APK_COUNT" -gt 0 ]; then
            echo "✅ تم إنشاء $APK_COUNT ملف APK بنجاح!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 الملفات:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh apk-output/*.apk >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 للتنزيل: اضغط على Artifacts في أعلى الصفحة" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل إنشاء APK" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📝 راجع logs أعلاه لمعرفة السبب" >> $GITHUB_STEP_SUMMARY
          fi
