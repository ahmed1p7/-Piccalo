# ═══════════════════════════════════════════════════════════════════════════════
# 📱 Sea POS - Build Android APK
# ═══════════════════════════════════════════════════════════════════════════════
# Il progetto Android è già committato nella cartella `android/` (generato con
# Capacitor 8), quindi qui NON c'è più bisogno di script fragili che riscrivono
# build.gradle / settings.gradle: era quello il motivo per cui le build
# precedenti fallivano (compileSdk 34 con AGP 8.13 + `capacitor.build.gradle`
# rimosso per errore).
#
# La chiave di firma è committata in android/keystore.properties:
#   → ogni nuovo APK può aggiornare l'app già installata sul telefono
#     (l'utente non deve disinstallare e quindi non perde i dati).
# ═══════════════════════════════════════════════════════════════════════════════

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Install Android packages
        # NB: si usa l'Android SDK già presente sul runner ubuntu-latest.
        # L'action android-actions/setup-android@v3 non viene usata perché
        # fallisce ("Failed to find package 'tools'": quel pacchetto legacy
        # non esiste più nel repository Google).
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager non trovato in $ANDROID_HOME/cmdline-tools"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "📦 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          echo "📂 platforms installate:"
          ls "$ANDROID_HOME/platforms" || true
          echo "📂 build-tools installati:"
          ls "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "❌ platforms;android-36 non disponibile"
            exit 1
          fi

      - name: ⚡ Setup Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit
        env:
          CI: false

      - name: ⚡ Build frontend
        run: npm run build
        env:
          CI: false
          VITE_BASE_PATH: './'
          # 🔥 Firebase config (opzionale: da GitHub Secrets)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 🔄 Sync Capacitor (web assets → Android)
        run: npx cap sync android

      - name: 📱 Build APK (release, firmato)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          CI: false

      - name: 📤 Collect APK + version.json
        id: collect
        if: always()
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "📦 Trovato: $apk"
            cp "$apk" apk-output/ 2>/dev/null || true
          done

          if [ -f "apk-output/app-release.apk" ]; then
            mv apk-output/app-release.apk apk-output/Sea-POS.apk
          fi
          if [ -f "apk-output/app-debug.apk" ]; then
            mv apk-output/app-debug.apk apk-output/Sea-POS-debug.apk
          fi

          # ── version.json: è questo file che l'app legge per sapere
          #    se c'è una versione nuova da installare ──
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          APK_SIZE=$(stat -c%s apk-output/Sea-POS.apk 2>/dev/null || echo 0)
          NOTES=$(git log -1 --pretty=%B | head -5 | tr '\n' ' ' | sed 's/"/\"/g')

          cat > apk-output/version.json << EOF
          {
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest/Sea-POS.apk",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "size": $APK_SIZE,
            "notes": "$NOTES"
          }
          EOF

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "📄 version.json:"
          cat apk-output/version.json

          echo ""
          echo "📁 APK files:"
          ls -lh apk-output/*.apk 2>/dev/null || echo "❌ Nessun APK prodotto"

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sea-POS-APK
          path: |
            apk-output/*.apk
          retention-days: 90
          if-no-files-found: warn

      # ── Rilascio con numero di versione (quello che l'app cerca) ──
      #    L'app interroga l'API di GitHub (che invia le intestazioni CORS)
      #    e cerca il rilascio con il tag di versione più alto.
      - name: 🚀 Publish release v${{ steps.collect.outputs.version }}
        if: always() && hashFiles('apk-output/Sea-POS.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: Sea POS ${{ steps.collect.outputs.version }}
          prerelease: false
          draft: false
          overwrite_files: true
          files: |
            apk-output/Sea-POS.apk
            apk-output/version.json
          body: |
            ## 📱 Sea POS ${{ steps.collect.outputs.version }}

            - **APK:** `Sea-POS.apk`
            - **Metadati:** `version.json`

            L'app controlla l'API di GitHub: se trova una versione più recente
            di quella installata mostra l'avviso "Aggiornamento disponibile" e
            permette di installarla con un tocco (i dati restano intatti).

            ### Installazione manuale
            1. Scarica `Sea-POS.apk`
            2. Aprilo sul telefono e conferma l'installazione
            3. L'app si aggiorna sopra quella già installata

      # ── Rilascio "latest": indirizzo stabile per il download diretto ──
      - name: 🚀 Publish rolling release "latest"
        if: always() && hashFiles('apk-output/Sea-POS.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (aggiornamento automatico)
          prerelease: false
          draft: false
          overwrite_files: true
          files: |
            apk-output/Sea-POS.apk
            apk-output/version.json
          body: |
            ## 🚀 Ultima versione disponibile

            Questo rilascio viene aggiornato automaticamente ad ogni push su `main`.

            - **APK:** `Sea-POS.apk`
            - **Metadati:** `version.json`

      - name: ✅ Report
        if: always()
        run: |
          {
            echo "## 📱 Build APK"
            echo ""
            APK_COUNT=$(find apk-output -name "*.apk" 2>/dev/null | wc -l)
            if [ "$APK_COUNT" -gt 0 ]; then
              echo "✅ APK pronti ($APK_COUNT)"
              echo ""
              echo '```'
              ls -lh apk-output/*.apk
              echo '```'
            else
              echo "❌ Nessun APK prodotto — controlla i log."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # ── Rilascio: quando si tagga v1.0.0 l'APK viene pubblicato come Release ──
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: Sea-POS-APK
          path: apk-output

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
          body: |
            ## 📱 Sea POS - APK

            Scarica il file `.apk`, trasferiscilo sul telefono e installalo
            (abilita "Installa app sconosciute" se Android lo richiede).

            **Aggiornamenti futuri:** installa sempre l'APK firmato con la stessa
            chiave: l'app si aggiorna sopra quella già installata senza perdere i dati.

            **Più telefoni:** apri l'app → icona Sync → "Copia" il codice di
            sincronizzazione e incollalo negli altri telefoni.
