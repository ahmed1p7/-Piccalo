# ═══════════════════════════════════════════════════════════════════════════════
# 📱 Sea POS - Build APK via PWABuilder (متوافق مع GitHub Actions)
# ═══════════════════════════════════════════════════════════════════════════════
# يبني APK من PWA باستخدام PWABuilder CLI
# يعمل تلقائياً عند كل push على main
# ═══════════════════════════════════════════════════════════════════════════════

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit
        env:
          CI: false

      - name: ⚡ Build frontend
        run: npm run build
        env:
          CI: false
          VITE_BASE_PATH: '/-Piccalo/'
          # 🔥 Firebase config (من GitHub Secrets)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # ═══ معاينة محلية للـ build للتحقق ═══
      - name: 🔍 Verify build output
        run: |
          echo "📁 محتويات dist/:"
          ls -la dist/
          echo ""
          echo "📄 manifest.json:"
          if [ -f "dist/manifest.json" ]; then
            cat dist/manifest.json
          else
            echo "❌ manifest.json غير موجود!"
            exit 1
          fi
          echo ""
          echo "🖼️ أيقونات:"
          ls -la dist/icon*.png 2>/dev/null || echo "⚠️ لا توجد أيقونات PNG"

      # ═══ 1) توليد Keystore مؤقت للتوقيع ═══
      - name: 🔐 Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore sea-pos.keystore \
            -alias sea_pos_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sea_pos_2024 \
            -keypass sea_pos_2024 \
            -dname "CN=Sea POS, OU=Mobile, O=Sea Ristorante, L=Napoli, S=NA, C=IT"

      # ═══ 2) تثبيت PWABuilder CLI (بديل Bubblewrap - أبسط وأكثر استقراراً) ═══
      - name: 🔧 Install PWABuilder
        run: npm install -g @bubblewrap/cli

      # ═══ 3) إنشاء مشروع TWA باستخدام manifest مباشرة ═══
      - name: 🎯 Initialize TWA project
        id: init-twa
        continue-on-error: true
        run: |
          # استخدام --manifest-file بدل URL لتجنب مشاكل الشبكة
          # ننسخ manifest من dist/ ونعدّل startUrl
          mkdir -p twa-build
          cp dist/manifest.json twa-build/manifest-local.json
          
          # تعديل startUrl ليكون /-Piccalo/ بدل /
          python3 -c "
          import json
          with open('twa-build/manifest-local.json', 'r') as f:
              m = json.load(f)
          m['start_url'] = '/-Piccalo/'
          m['scope'] = '/-Piccalo/'
          with open('twa-build/manifest-local.json', 'w') as f:
              json.dump(m, f, indent=2)
          print('✅ manifest-local.json معدّل')
          "

      # ═══ 4) محاولة بناء APK عبر Bubblewrap (الطريقة 1) ═══
      - name: 📱 Try Bubblewrap build
        id: bubblewrap-build
        continue-on-error: true
        run: |
          # إنشاء twa manifest من ملف local
          bubblewrap init \
            --manifest="$(pwd)/twa-build/manifest-local.json" \
            --directory="./twa-build/app" \
            --applicationName="Sea POS" \
            --packageId="com.sea.pos" \
            --host="ahmed1p7.github.io" \
            --no-interactive \
            || true
          
          # فحص لو تم إنشاء المشروع
          if [ -d "./twa-build/app" ]; then
            echo "✅ تم إنشاء مشروع TWA"
            cd ./twa-build/app
            
            # نسخ Keystore
            cp ../../sea-pos.keystore ./android.keystore
            
            # بناء APK
            bubblewrap build \
              --no-deploy \
              --signingKeyPath=./android.keystore \
              --signingKeyPassword=sea_pos_2024 \
              --signingKeyAlias=sea_pos_key \
              --signingKeyAliasPassword=sea_pos_2024 \
              || true
          else
            echo "❌ فشل إنشاء مشروع TWA"
          fi

      # ═══ 5) طريقة بديلة: استخدام Cordova/Capacitor لو Bubblewrap فشل ═══
      - name: 📱 Alternative: Capacitor build
        if: steps.bubblewrap-build.outcome != 'success'
        continue-on-error: true
        run: |
          echo "🔄 Bubblewrap فشل، نجرّب Capacitor..."
          
          # تثبيت Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --save
          
          # تهيئة Capacitor
          npx cap init "Sea POS" "com.sea.pos" --web-dir=dist
          
          # إضافة Android
          npx cap add android || true
          
          # نسخ الـ web build
          npx cap copy android || true
          
          # بناء APK (debug)
          cd android
          ./gradlew assembleDebug || true
          cd ..
          
          # فحص لو تم إنشاء APK
          find android -name "*.apk" -type f 2>/dev/null | head -5

      # ═══ 6) تجميع كل ملفات APK المتوفرة ═══
      - name: 📤 Collect APK files
        if: always()
        run: |
          mkdir -p apk-output
          
          # البحث في كل المواقع المحتملة
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "📦 وجدت: $apk"
            cp "$apk" apk-output/ 2>/dev/null || true
          done
          
          # عرض النتائج
          echo ""
          echo "📁 APK files:"
          ls -la apk-output/*.apk 2>/dev/null || echo "❌ لا توجد ملفات APK"
          
          # إنشاء ملف معلومات
          cat > apk-output/INFO.txt << 'EOF'
          Sea POS - APK Build Info
          ========================
          Build Date: $(date)
          Commit: ${{ github.sha }}
          
          لو لا يوجد APK هنا:
          1. راجع logs الأخطاء في GitHub Actions
          2. تأكد أن GitHub Pages مفعّل
          3. راجع twa/SETUP.md في المستودع
          EOF

      # ═══ 7) رفع النتائج ═══
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-pos-apk
          path: |
            apk-output/*.apk
            apk-output/INFO.txt
          retention-days: 30

      # ═══ 8) تقرير النتائج ═══
      - name: ✅ Report results
        if: always()
        run: |
          echo "## 📱 Build APK Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          APK_COUNT=$(find apk-output -name "*.apk" -type f 2>/dev/null | wc -l)
          
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "✅ تم إنشاء $APK_COUNT ملف APK" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 الملفات:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh apk-output/*.apk >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ فشل إنشاء APK" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 الخطوات المطلوبة:" >> $GITHUB_STEP_SUMMARY
            echo "1. تأكد أن GitHub Pages مفعّل" >> $GITHUB_STEP_SUMMARY
            echo "2. تأكد أن التطبيق منشور على https://ahmed1p7.github.io/-Piccalo/" >> $GITHUB_STEP_SUMMARY
            echo "3. راجع twa/SETUP.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 محتويات apk-output:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -la apk-output/ >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
