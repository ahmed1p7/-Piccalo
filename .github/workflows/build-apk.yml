# ═══════════════════════════════════════════════════════════════════════════════
# 📱 Sea POS - Build Android APK
# ═══════════════════════════════════════════════════════════════════════════════
# Il progetto Android è già committato nella cartella `android/` (generato con
# Capacitor 8), quindi qui NON c'è più bisogno di script fragili che riscrivono
# build.gradle / settings.gradle: era quello il motivo per cui le build
# precedenti fallivano (compileSdk 34 con AGP 8.13 + `capacitor.build.gradle`
# rimosso per errore).
#
# La chiave di firma è committata in android/keystore.properties:
#   → ogni nuovo APK può aggiornare l'app già installata sul telefono
#     (l'utente non deve disinstallare e quindi non perde i dati).
# ═══════════════════════════════════════════════════════════════════════════════

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: ⚡ Setup Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit
        env:
          CI: false

      - name: ⚡ Build frontend
        run: npm run build
        env:
          CI: false
          VITE_BASE_PATH: './'
          # 🔥 Firebase config (opzionale: da GitHub Secrets)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: 🔄 Sync Capacitor (web assets → Android)
        run: npx cap sync android

      - name: 📱 Build APK (release, firmato)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          CI: false

      - name: 📤 Collect APK
        if: always()
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "📦 Trovato: $apk"
            cp "$apk" apk-output/ 2>/dev/null || true
          done

          if [ -f "apk-output/app-release.apk" ]; then
            mv apk-output/app-release.apk apk-output/Sea-POS.apk
          fi
          if [ -f "apk-output/app-debug.apk" ]; then
            mv apk-output/app-debug.apk apk-output/Sea-POS-debug.apk
          fi

          echo ""
          echo "📁 APK files:"
          ls -lh apk-output/*.apk 2>/dev/null || echo "❌ Nessun APK prodotto"

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sea-POS-APK
          path: |
            apk-output/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: ✅ Report
        if: always()
        run: |
          {
            echo "## 📱 Build APK"
            echo ""
            APK_COUNT=$(find apk-output -name "*.apk" 2>/dev/null | wc -l)
            if [ "$APK_COUNT" -gt 0 ]; then
              echo "✅ APK pronti ($APK_COUNT)"
              echo ""
              echo '```'
              ls -lh apk-output/*.apk
              echo '```'
            else
              echo "❌ Nessun APK prodotto — controlla i log."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # ── Rilascio: quando si tagga v1.0.0 l'APK viene pubblicato come Release ──
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: Sea-POS-APK
          path: apk-output

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
          body: |
            ## 📱 Sea POS - APK

            Scarica il file `.apk`, trasferiscilo sul telefono e installalo
            (abilita "Installa app sconosciute" se Android lo richiede).

            **Aggiornamenti futuri:** installa sempre l'APK firmato con la stessa
            chiave: l'app si aggiorna sopra quella già installata senza perdere i dati.

            **Più telefoni:** apri l'app → icona Sync → "Copia" il codice di
            sincronizzazione e incollalo negli altri telefoni.
